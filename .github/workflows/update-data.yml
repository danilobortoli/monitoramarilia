name: Atualização Diária do Dashboard

on:
  schedule:
    # Executa diariamente às 6h (horário de Brasília = 9h UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:  # Permite execução manual

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Playwright e navegadores
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Coletar dados do Portal de Transparência
        run: |
          python -m src.main update-dashboard --output docs/data/
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verificar arquivos gerados
        run: |
          echo "Arquivos em docs/data/:"
          ls -la docs/data/ || echo "Pasta não existe"

      - name: Verificar alterações
        id: check_changes
        run: |
          git diff --quiet docs/data/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit e push das alterações
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          git commit -m "chore: atualização automática dos dados do dashboard

          Data: $(date +'%Y-%m-%d %H:%M:%S')
          Portal: https://transparencia.marilia.sp.gov.br"
          git push

      - name: Resumo da execução
        run: |
          echo "## Atualização do Dashboard MonitoraMarília" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "**Portal:** https://transparencia.marilia.sp.gov.br" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f docs/data/dashboard.json ]; then
            echo "### Arquivos atualizados:" >> $GITHUB_STEP_SUMMARY
            ls docs/data/*.json 2>/dev/null | while read f; do
              echo "- ✅ $(basename $f)" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "⚠️ Verificar logs para detalhes" >> $GITHUB_STEP_SUMMARY
          fi
