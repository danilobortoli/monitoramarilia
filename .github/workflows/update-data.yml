name: Atualização de Dados e Relatórios

on:
  schedule:
    # Executa diariamente às 6h (horário de Brasília = 9h UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      generate_reports:
        description: 'Gerar relatórios PDF'
        required: false
        default: 'true'
        type: boolean

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  collect-data:
    runs-on: ubuntu-latest
    name: Coletar Dados das APIs

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do sistema (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar diretórios necessários
        run: |
          mkdir -p docs/data
          mkdir -p docs/relatorios
          mkdir -p data

      - name: Coletar dados do SICONFI
        run: |
          echo "Coletando indicadores fiscais do SICONFI..."
          python -m src.main siconfi --ano $(date +%Y) --salvar-db || echo "SICONFI: Alguns dados não disponíveis"

      - name: Coletar dados do TCE-SP
        run: |
          echo "Coletando despesas e fornecedores do TCE-SP..."
          python -m src.main tce-sp --ano $(date +%Y) --salvar-db || echo "TCE-SP: Alguns dados não disponíveis"

      - name: Coletar dados do Portal Federal
        if: ${{ env.PORTAL_TRANSPARENCIA_KEY != '' }}
        run: |
          echo "Coletando transferências e convênios do Portal Federal..."
          python -m src.main portal-federal --ano $(date +%Y) --salvar-db || echo "Portal Federal: Alguns dados não disponíveis"
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}

      - name: Atualizar dashboard
        run: |
          echo "Gerando dados para o dashboard..."
          python -m src.main update-dashboard --output docs/data/

      - name: Gerar relatórios PDF
        if: ${{ github.event.inputs.generate_reports == 'true' || github.event_name == 'schedule' }}
        run: |
          echo "Gerando relatórios PDF..."
          python -m src.main generate-report --tipo fiscal --output docs/relatorios/ || echo "Relatório fiscal não gerado"
          python -m src.main generate-report --tipo fornecedores --output docs/relatorios/ || echo "Relatório fornecedores não gerado"

      - name: Listar arquivos gerados
        run: |
          echo "=== Arquivos de dados ==="
          ls -la docs/data/ || echo "Nenhum arquivo em docs/data/"
          echo ""
          echo "=== Relatórios ==="
          ls -la docs/relatorios/ || echo "Nenhum relatório gerado"
          echo ""
          echo "=== Banco de dados ==="
          ls -la data/ || echo "Nenhum arquivo em data/"

      - name: Verificar alterações
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push das alterações
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: atualização automática de dados e relatórios

          Data: $(date +'%Y-%m-%d %H:%M:%S')
          Fontes: SICONFI, TCE-SP, Portal Federal"
          git push

      - name: Resumo da execução
        run: |
          echo "## Atualização do MonitoraMarília" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fontes de Dados" >> $GITHUB_STEP_SUMMARY
          echo "- SICONFI (Tesouro Nacional): Indicadores fiscais e LRF" >> $GITHUB_STEP_SUMMARY
          echo "- TCE-SP: Despesas e fornecedores municipais" >> $GITHUB_STEP_SUMMARY
          echo "- Portal Federal: Transferências, convênios, sanções" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Arquivos Gerados" >> $GITHUB_STEP_SUMMARY
          if [ -f docs/data/dashboard.json ]; then
            echo "- dashboard.json" >> $GITHUB_STEP_SUMMARY
          fi
          ls docs/relatorios/*.pdf 2>/dev/null | while read f; do
            echo "- $(basename $f)" >> $GITHUB_STEP_SUMMARY
          done || echo "- Nenhum relatório PDF gerado" >> $GITHUB_STEP_SUMMARY
