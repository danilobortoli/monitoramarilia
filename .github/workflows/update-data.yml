name: Atualização de Dados e Relatórios

on:
  schedule:
    # Executa diariamente às 6h (horário de Brasília = 9h UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      gerar_boletim:
        description: 'Gerar o boletim semanal agora (fora da segunda-feira)'
        required: false
        default: false
        type: boolean

# Necessário para o passo de commit/push devolver os dados ao repositório
permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  # Disponibiliza a chave para os passos e para a condição `if` do Portal Federal
  PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
  # Leitura do acompanhamento da MATRA no Notion (opcional; sem ela o site segue sem esses dados)
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

jobs:
  collect-data:
    runs-on: ubuntu-latest
    name: Coletar Dados das APIs
    # Rede de segurança: as APIs públicas podem ficar lentas/limitar (throttle);
    # o job nunca deve ficar pendurado nas requisições.
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do sistema (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar diretórios necessários
        run: |
          mkdir -p docs/data
          mkdir -p docs/relatorios
          mkdir -p data

      - name: Coletar execução orçamentária (RREO / SICONFI)
        run: |
          ANO=$(date +%Y)
          echo "Coletando Relatório Resumido da Execução Orçamentária (RREO) de $ANO..."
          # Balanço orçamentário por bimestre (a API publica conforme os bimestres fecham)
          for BIM in 1 2 3 4 5 6; do
            python -m src.main siconfi --tipo rreo --ano $ANO --bimestre $BIM \
              -o docs/data/rreo_${ANO}_bim${BIM}.json \
              && echo "RREO ${ANO} bim ${BIM}: OK" \
              || echo "RREO ${ANO} bim ${BIM}: indisponível"
          done
          # Fallback: fechamento do ano anterior (6º bimestre), útil no início do ano
          python -m src.main siconfi --tipo rreo --ano $((ANO - 1)) --bimestre 6 \
            -o docs/data/rreo_$((ANO - 1))_bim6.json \
            || echo "RREO $((ANO - 1)) bim 6: indisponível"

      - name: Coletar indicadores fiscais e alertas LRF (SICONFI)
        run: |
          ANO=$(date +%Y)
          echo "Coletando resumo fiscal e alertas da LRF..."
          python -m src.main siconfi --tipo resumo --ano $ANO \
            -o docs/data/siconfi_resumo_${ANO}.json || echo "SICONFI resumo: indisponível"
          python -m src.main siconfi --tipo alertas --ano $ANO \
            -o docs/data/siconfi_alertas_${ANO}.json || echo "SICONFI alertas: indisponível"

      # Obs.: a execução do TCE-SP (despesas, fornecedores, evolução mensal e
      # despesa por função) é coletada uma única vez no passo "Atualizar
      # dashboard" abaixo, que já grava docs/data/tce-sp.json. Dumps brutos
      # anuais separados foram removidos por serem redundantes, lentos
      # (re-buscavam o ano inteiro) e pesados no histórico do repositório.

      - name: Coletar dados do Portal Federal
        if: ${{ env.PORTAL_TRANSPARENCIA_KEY != '' }}
        run: |
          ANO=$(date +%Y)
          echo "Coletando transferências, convênios e emendas do Portal Federal..."
          python -m src.main portal-federal --tipo transferencias --ano $ANO \
            -o docs/data/federal_transferencias_${ANO}.json || echo "Portal Federal transferências: indisponível"
          python -m src.main portal-federal --tipo convenios --ano $ANO \
            -o docs/data/federal_convenios_${ANO}.json || echo "Portal Federal convênios: indisponível"

      - name: Calcular Radar do Observatório (Prefeitura de Marília)
        run: |
          ANO=$(date +%Y)
          echo "Coletando portal e dados abertos da Prefeitura e calculando o radar..."
          python -m src.main observatorio --ano $ANO \
            -o docs/data/observatorio.json || echo "Observatório: indisponível"

      # Boletim semanal: às segundas-feiras (ou no disparo manual com gerar_boletim),
      # cobrindo as sete coletas que terminam no dia. Grava o PDF em docs/relatorios
      # e atualiza docs/data/relatorios.json, lido pela página Boletins.
      - name: Gerar boletim semanal
        if: ${{ github.event.inputs.gerar_boletim == 'true' || github.event_name == 'schedule' }}
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event.inputs.gerar_boletim }}" = "true" ]; then
            python -m src.main boletim || echo "Boletim: não gerado"
          else
            echo "Boletim só às segundas-feiras."
          fi

      # Regera as páginas do site a partir dos quadros do canvas com os dados do dia.
      # Se a coleta falhar, as páginas continuam com o observatorio.json anterior.
      - name: Gerar páginas do Observatório
        run: |
          node design/observatorio-canvas/estatico.js design/observatorio-canvas docs \
            docs/data/observatorio.json config/observatorio.json

      - name: Atualizar dashboard
        run: |
          echo "Gerando dados para o dashboard..."
          python -m src.main update-dashboard --output docs/data/

      - name: Indexar relatórios para o site
        run: |
          echo "Atualizando índice de relatórios (docs/data/relatorios.json)..."
          python -m src.main index-reports || echo "Índice de relatórios não atualizado"

      - name: Listar arquivos gerados
        run: |
          echo "=== Arquivos de dados ==="
          ls -la docs/data/ || echo "Nenhum arquivo em docs/data/"
          echo ""
          echo "=== Relatórios ==="
          ls -la docs/relatorios/ || echo "Nenhum relatório gerado"
          echo ""
          echo "=== Banco de dados ==="
          ls -la data/ || echo "Nenhum arquivo em data/"

      - name: Verificar alterações
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit e push das alterações
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: atualização automática de dados e relatórios

          Data: $(date +'%Y-%m-%d %H:%M:%S')
          Fontes: SICONFI, TCE-SP, Portal Federal, Prefeitura de Marília"
          git push

      - name: Resumo da execução
        run: |
          echo "## Atualização do MonitoraMarília" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Data:** $(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Fontes de Dados" >> $GITHUB_STEP_SUMMARY
          echo "- SICONFI (Tesouro Nacional): Indicadores fiscais e LRF" >> $GITHUB_STEP_SUMMARY
          echo "- TCE-SP: Despesas e fornecedores municipais" >> $GITHUB_STEP_SUMMARY
          echo "- Portal Federal: Transferências, convênios, sanções" >> $GITHUB_STEP_SUMMARY
          echo "- Prefeitura de Marília: portal da transparência e dados abertos (radar)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Arquivos Gerados" >> $GITHUB_STEP_SUMMARY
          if [ -f docs/data/dashboard.json ]; then
            echo "- dashboard.json" >> $GITHUB_STEP_SUMMARY
          fi
          ls docs/relatorios/*.pdf 2>/dev/null | while read f; do
            echo "- $(basename $f)" >> $GITHUB_STEP_SUMMARY
          done || echo "- Nenhum relatório PDF gerado" >> $GITHUB_STEP_SUMMARY
